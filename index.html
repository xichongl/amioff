<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find the days when your people are off together."
    />
    <meta name="theme-color" content="#26215f" />
    <link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Amioff — find time together</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f5ef;color:#232139;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
            <section style="max-width:560px;padding:32px;border:1px solid #dfddd4;border-radius:20px;background:#fffefa;box-shadow:0 18px 60px rgba(28,24,72,.12)">
              <div style="display:inline-flex;align-items:center;gap:10px;color:#26215f;font-size:22px;font-weight:800">
                <img src="./public/brand-mark.svg" alt="" width="40" height="40" />
                amioff
              </div>
              <h1 style="margin:28px 0 10px;font-size:32px;line-height:1.1;letter-spacing:-.04em">Amioff needs its local server.</h1>
              <p style="margin:0 0 20px;color:#67657a;line-height:1.6">This project cannot run by opening <code>index.html</code> directly. In a terminal, open the Amioff folder and run:</p>
              <pre style="overflow:auto;margin:0;padding:16px;border-radius:12px;background:#26215f;color:#fff;font-size:14px"><code>npm install
npm start</code></pre>
              <p style="margin:18px 0 0;color:#67657a;font-size:14px;line-height:1.55">Vite will start the app and open the correct <strong>http://localhost</strong> address in your browser.</p>
            </section>
          </main>
        `
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
